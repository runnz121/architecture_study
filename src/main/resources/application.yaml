server:
  port: 8085

spring:
  application:
    name: video-tutorials
  datasource:
    url: jdbc:h2:mem:video_tutorials;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Chapter 9: send-email Component 설정 (env.js의 EMAIL_DIRECTORY / SYSTEM_SENDER_EMAIL_ADDRESS 대응)
app:
  email:
    directory: ./emails/ch9
    sender: no-reply@video-tutorials.example.com
